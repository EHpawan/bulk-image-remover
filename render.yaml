services:
  - type: web
    name: clearcut-payment-api
    runtime: python
    plan: starter
    buildCommand: pip install -r payment-requirements.txt
    startCommand: uvicorn payment_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
